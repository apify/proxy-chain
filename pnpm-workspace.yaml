# 24-hour quarantine on newly published versions to blunt supply-chain attacks
# (compromised packages typically get yanked within hours of discovery).
# This is the primary motivation for migrating off npm — see issue #658.
# Excludes are scopes we publish ourselves and trust on the same release cadence.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"

# Postinstall protection — pnpm only runs build scripts for packages with `: true` here.
# `: false` is an explicit-deny marker. New transitives with build scripts surface as
# placeholders the first time they appear — review them, then change to `true` or `false`.
allowBuilds:
  # puppeteer downloads its Chromium binary in postinstall — required for the e2e
  # tests that drive headless Chrome through the proxy.
  puppeteer: true
  # esbuild's postinstall installs the platform-specific binary — required by tsx.
  esbuild: true
  # core-js' postinstall only prints a donation banner; no functional impact.
  core-js: false

# pnpm 11's default is `true`, which fails `pnpm install --frozen-lockfile` whenever a new
# build-script transitive lands. We keep the security benefit (only allowlisted scripts run)
# without making installs flaky on every dependency bump.
strictDepBuilds: false
